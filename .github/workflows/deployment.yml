# The caller holds the concurrency group: a caller and its called workflow sharing one group is
# a deadlock, and GitHub cancels the run rather than serialize it.
name: deployment
on:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          jq -r '"PROJECT=\(.project)\nPROJECT_NUMBER=\(.project_number)\nREGION=\(.region)"' deployment.json >> "$GITHUB_ENV"
      - run: |
          echo "REGISTRY=$REGION-docker.pkg.dev/$PROJECT/mcp" >> "$GITHUB_ENV"
          echo "WIF_PROVIDER=projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx companygraph-mcp-deploy snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx companygraph-mcp-deploy page-css
      - run: npx companygraph-mcp-deploy jsonld
      # The page checks open a browser: they measure the rendered page rather than read the
      # stylesheet, which is the only way to see a gutter that did not apply or a wordmark that
      # broke. Chromium alone, and only here, because nothing the image runs needs one.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - id: tag
        run: echo "image=$REGISTRY/server:$(npx companygraph-mcp-deploy tag)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: docker build -t "${{ steps.tag.outputs.image }}" .
      - if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: deploy@${{ env.PROJECT }}.iam.gserviceaccount.com
      - if: github.event_name == 'push'
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet && docker push "${{ steps.tag.outputs.image }}"
  terraform:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - run: |
          jq -r '"PROJECT=\(.project)\nPROJECT_NUMBER=\(.project_number)\nREGION=\(.region)"' ../deployment.json >> "$GITHUB_ENV"
      - run: |
          echo "WIF_PROVIDER=projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github" >> "$GITHUB_ENV"
      # A pull request plans as terraform-plan@, which reads and changes nothing; only a push to main
      # applies, as terraform@, and the bootstrap lets neither account be used the other way.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ github.event_name == 'push' && 'terraform' || 'terraform-plan' }}@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - if: hashFiles('infra/bootstrap/*.tf') != ''
        run: terraform -chdir=bootstrap init -backend=false -input=false && terraform -chdir=bootstrap validate
      - if: github.event_name == 'pull_request'
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -var "image=$IMAGE" > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo 'Terraform plan for `'"$IMAGE"'`'; echo; echo '```'; tail -c 60000 plan.txt; echo '```'; } > comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          test "${{ steps.plan.outputs.exit }}" = "0"
      - if: github.event_name == 'push'
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: terraform apply -input=false -auto-approve -var "image=$IMAGE"
      - if: github.event_name == 'push'
        run: |
          URL=$(terraform output -raw service_url)
          WANT=$(jq -r .commit ../source.json)
          GOT=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 5 --max-time 30 -X POST "$URL/mcp" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_types","arguments":{}}}' | jq -r .result.structuredContent.model.commit)
          echo "serving $GOT, pinned $WANT"; test "$GOT" = "$WANT"
