name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The JavaScript in lib/, bin/ and deploy/ is the source, and its types are JSDoc in the same
      # files. The declarations in types/ are written from that JSDoc and committed, because a
      # consumer takes the package by tag and builds nothing. TypeScript and Node's types are
      # devDependencies and nothing else is: they are installed here to write the declarations
      # into a temporary folder and fail when the committed ones are not what the JSDoc declares.
      - run: npm run build:check
      # The page checks open a browser: a rule that is present and wrong is invisible to
      # anything that reads the stylesheet, and the page this package ships is what an instance
      # supplying no design of its own renders with.
      - run: npx playwright install --with-deps chromium
      - run: npm test
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform -chdir=deploy/google/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/google/terraform validate
      - run: terraform -chdir=deploy/google/bootstrap init -backend=false -input=false
      - run: terraform -chdir=deploy/google/bootstrap validate
      - run: terraform -chdir=deploy/google/kpi init -backend=false -input=false
      - run: terraform -chdir=deploy/google/kpi validate
      - run: terraform -chdir=deploy/azure/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/azure/terraform validate
      - run: terraform -chdir=deploy/azure/bootstrap init -backend=false -input=false
      - run: terraform -chdir=deploy/azure/bootstrap validate
      - run: terraform fmt -check -recursive deploy
